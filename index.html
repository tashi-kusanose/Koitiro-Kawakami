<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>PHOTO ALBUM</title>
<style>
:root{--bg:#f6f7f9;--card:#ffffff;--line:#e4e7ec;--txt:#20242a;--mut:#7b828d;--accent:#2e7dd7;--header:#ffffff;--shadow:0 8px 24px #00000012}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--txt);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
button,select{font:inherit}.hidden{display:none!important}
.head{position:sticky;top:0;z-index:30;display:grid;grid-template-columns:46px 1fr 46px;align-items:center;min-height:66px;padding:max(6px,env(safe-area-inset-top)) 12px 6px;background:color-mix(in srgb,var(--header) 94%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.brand{grid-column:2;text-align:center;min-width:0;padding:0 4px}.brand small{display:block;color:var(--mut);font-size:8px;letter-spacing:.24em}.brand h1{margin:3px 0 0;font-family:Georgia,"Times New Roman",serif;font-size:20px;font-weight:500;line-height:1.15;white-space:normal;overflow:visible;text-overflow:clip;word-break:keep-all}
.ib{width:42px;height:42px;border:0;background:transparent;color:var(--txt);display:grid;place-items:center;text-decoration:none;font-size:22px;cursor:pointer;border-radius:12px}.head>#back{grid-column:1}.head>a.ib{grid-column:3;justify-self:end}#back.hidden{display:grid!important;visibility:hidden;pointer-events:none}
.wrap{width:min(1180px,100%);margin:auto;padding:0 14px 72px}
.desktopHero{display:none}
.mobileIntro{padding:24px 6px 18px}.mobileIntro .lead{margin:0 0 6px;font-size:14px;font-weight:700}.mobileIntro .intro{margin:0;color:var(--mut);font-size:12px;line-height:1.7;white-space:pre-line}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 14px}.barTitle{font-size:17px;font-weight:800}.barMeta{color:var(--mut);font-size:11px;margin-top:2px}.sel{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:11px;padding:9px 11px}
.albums{display:grid;grid-template-columns:1fr;gap:16px}
.album{overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:var(--shadow);cursor:pointer}
.cover{aspect-ratio:16/9;background:#ddd;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover;display:block}
.meta{display:grid;grid-template-columns:1fr 32px;gap:10px;align-items:center;padding:12px 13px 13px}.meta h2{margin:0;font-size:16px}.meta p{margin:4px 0 0;color:var(--mut);font-size:11px}.metaBottom{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.count{color:var(--mut);font-size:10px}.openHint{font-size:10px;color:var(--accent);font-weight:800}.chev{display:grid;place-items:center;font-size:22px;color:var(--mut)}
.empty{padding:50px 20px;border:1px dashed var(--line);border-radius:16px;text-align:center;color:var(--mut);background:var(--card)}
.detailTop{display:grid;grid-template-columns:42px 1fr auto;gap:8px;align-items:start;padding:18px 0 14px}.detailBack{width:40px;height:40px;border:0;background:transparent;color:var(--txt);font-size:25px;cursor:pointer}.detailTitle h2{margin:0;font-size:23px}.detailTitle p{margin:7px 0 0;color:var(--mut);font-size:12px;line-height:1.65;white-space:pre-line}.detailInfo{color:var(--mut);font-size:11px;text-align:right;padding-top:4px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px}.tile{border:0;padding:0;aspect-ratio:1;background:#e8e8e8;overflow:hidden;cursor:zoom-in}.tile img{width:100%;height:100%;object-fit:cover;display:block}.more{text-align:center;padding:24px 0;color:var(--mut);font-size:11px}
.light{width:100vw;height:100dvh;max-width:none;max-height:none;margin:0;padding:0;border:0;background:#000}.light::backdrop{background:#000}.light figure{margin:0;width:100%;height:100%;display:grid;place-items:center;padding:66px 10px 110px}.light img{max-width:100%;max-height:100%;object-fit:contain}.x,.nav{position:fixed;z-index:3;border:0;color:#fff;background:#0009;cursor:pointer}.x{top:max(14px,env(safe-area-inset-top));right:14px;width:42px;height:42px;border-radius:50%;font-size:28px}.nav{top:50%;transform:translateY(-50%);width:46px;height:58px;border-radius:50%;font-size:38px}.prev{left:10px}.next{right:10px}.pc{position:fixed;top:max(24px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);color:#fff;font-size:12px}.cap{position:fixed;left:28px;right:28px;bottom:34px;text-align:center;color:#fff;font-size:13px;line-height:1.6}
.toast{position:fixed;z-index:99;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100% - 28px);padding:12px 16px;border-radius:999px;background:var(--txt);color:var(--card);font-size:12px}
@media(min-width:760px){
 .head{grid-template-columns:1fr auto 1fr;padding-left:28px;padding-right:28px}.head .ib:first-child{justify-self:start}.brand{grid-column:2;justify-self:center;text-align:center}.head .ib:last-child{justify-self:end}.wrap{padding:0 24px 80px}
 .desktopHero{display:block;position:relative;height:270px;margin:18px 0 26px;border-radius:0;overflow:hidden;background:linear-gradient(120deg,var(--accent),var(--header));border:1px solid var(--line)}
 .desktopHero .heroImage{position:absolute;inset:0;background-size:cover;background-position:center}.desktopHero .shade{position:absolute;inset:0;background:linear-gradient(90deg,#0008 0,#0003 46%,transparent 80%)}.desktopHero .heroCopy{position:absolute;left:34px;top:50%;transform:translateY(-50%);max-width:520px;color:white}.desktopHero h2{font-size:30px;margin:0 0 9px}.desktopHero p{margin:0;font-size:15px;line-height:1.8;white-space:pre-line}
 .mobileIntro{display:none}.bar{padding:0 0 14px}.albums{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.album{border-radius:10px}.meta{padding:12px}.grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.detailTop{padding-top:28px}.detailTitle h2{font-size:30px}
}
</style>
</head>
<body>
<header class="head"><button id="back" class="ib hidden" aria-label="戻る">‹</button><div class="brand"><small id="eyebrow">PHOTO COLLECTION</small><h1 id="title">My Photo Album</h1></div><a class="ib" href="admin.html" aria-label="管理画面">☰</a></header>
<main class="wrap">
<section id="albumsView">
  <div id="desktopHero" class="desktopHero"><div id="heroImage" class="heroImage"></div><div class="shade"></div><div class="heroCopy"><h2 id="desktopLead"></h2><p id="desktopIntro"></p></div></div>
  <div class="mobileIntro"><p id="headerText" class="lead">大切な思い出を写真で</p><p id="introText" class="intro"></p></div>
  <div class="bar"><div><div class="barTitle">アルバム一覧</div><div id="albumCount" class="barMeta">読み込み中...</div></div><select id="sort" class="sel"><option value="newest">新しい順</option><option value="oldest">古い順</option><option value="title">タイトル順</option></select></div>
  <div id="albums" class="albums"></div>
</section>
<section id="gallery" class="hidden">
  <div class="detailTop"><button id="detailBack" class="detailBack">‹</button><div id="detailTitle" class="detailTitle"></div><div id="detailInfo" class="detailInfo"></div></div>
  <div id="photos" class="grid"></div><div id="more" class="more"></div>
</section>
</main>
<dialog id="light" class="light"><button id="close" class="x">×</button><button id="prev" class="nav prev">‹</button><figure><img id="big" alt=""></figure><button id="next" class="nav next">›</button><div id="pc" class="pc"></div><div id="cap" class="cap"></div></dialog>
<div id="toast" class="toast hidden"></div>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient('https://esfgrykcvdctnvdqipbj.supabase.co','sb_publishable_Rwb3qaRXdWZoo05LrbFaDg_29tMI7uI');
const bucket='photo-album',pageSize=40,$=s=>document.querySelector(s);
const e={albumsView:$('#albumsView'),gallery:$('#gallery'),albums:$('#albums'),count:$('#albumCount'),sort:$('#sort'),back:$('#back'),detailBack:$('#detailBack'),title:$('#title'),eyebrow:$('#eyebrow'),headerText:$('#headerText'),introText:$('#introText'),desktopLead:$('#desktopLead'),desktopIntro:$('#desktopIntro'),heroImage:$('#heroImage'),detailTitle:$('#detailTitle'),detailInfo:$('#detailInfo'),photos:$('#photos'),more:$('#more'),light:$('#light'),big:$('#big'),cap:$('#cap'),pc:$('#pc'),close:$('#close'),prev:$('#prev'),next:$('#next'),toast:$('#toast')};
let site=null,albums=[],album=null,photos=[],page=0,more=true,loading=false,idx=-1;
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const url=p=>sb.storage.from(bucket).getPublicUrl(p).data.publicUrl;
const date=v=>{if(!v)return'';const d=new Date(v+'T00:00:00');return new Intl.DateTimeFormat('ja-JP').format(d)};
function toast(m){e.toast.textContent=m;e.toast.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>e.toast.classList.add('hidden'),3200)}
function applySite(){if(!site)return;const t=site.theme||{},r=document.documentElement.style;r.setProperty('--bg',t.background||'#f6f7f9');r.setProperty('--card',t.surface||'#ffffff');r.setProperty('--txt',t.text||'#20242a');r.setProperty('--mut',t.muted||'#7b828d');r.setProperty('--accent',t.accent||'#2e7dd7');r.setProperty('--header',t.header||t.surface||'#ffffff');e.eyebrow.textContent=site.eyebrow_text||'PHOTO COLLECTION';e.title.textContent=site.page_title||'My Photo Album';e.headerText.textContent=site.header_text||'';e.introText.textContent=site.intro_text||'';e.desktopLead.textContent=site.header_text||site.page_title||'';e.desktopIntro.textContent=site.intro_text||'';e.headerText.classList.toggle('hidden',!site.header_text);e.introText.classList.toggle('hidden',!site.intro_text);document.title=site.page_title||'PHOTO ALBUM';document.querySelector('meta[name="theme-color"]').setAttribute('content',t.header||t.surface||'#ffffff')}
async function loadSite(){const params=new URLSearchParams(location.search),slug=params.get('site');let q=sb.from('photo_album_sites_public').select('*');q=slug?q.eq('slug',slug):q.order('created_at',{ascending:true}).limit(1);const{data,error}=await q.maybeSingle();if(error)return toast(error.message);site=data||null;if(site)applySite();await loadAlbums()}
async function loadAlbums(){let q=sb.from('photo_albums_public').select('*');if(site)q=q.eq('site_id',site.id);const{data,error}=await q;if(error)return toast(error.message);albums=(data||[]).map(a=>({...a,cover_url:a.cover_path?url(a.cover_path):''}));const first=albums.find(a=>a.cover_url);if(first)e.heroImage.style.backgroundImage='url("'+first.cover_url.replace(/"/g,'%22')+'")';renderAlbums();const aq=new URLSearchParams(location.search).get('album');if(aq)openAlbum(aq,false)}
function renderAlbums(){const s=e.sort.value,l=[...albums].sort((a,b)=>s==='title'?a.title.localeCompare(b.title,'ja'):(s==='oldest'?String(a.album_date||a.created_at).localeCompare(String(b.album_date||b.created_at)):String(b.album_date||b.created_at).localeCompare(String(a.album_date||a.created_at))));e.count.textContent=l.length+' ALBUMS';e.albums.innerHTML=l.length?l.map(a=>`<article class="album" data-id="${esc(a.id)}" tabindex="0"><div class="cover">${a.cover_url?'<img loading="lazy" src="'+esc(a.cover_url)+'" alt="">':''}</div><div class="meta"><div><h2>${esc(a.title)}</h2><div class="metaBottom"><p>${date(a.album_date)}</p><span class="count">${Number(a.photo_count||0)} photos</span><span class="openHint">写真を見る</span></div></div><div class="chev">›</div></div></article>`).join(''):'<div class="empty">公開中のアルバムはまだありません。</div>';e.albums.querySelectorAll('.album').forEach(x=>{const run=()=>openAlbum(x.dataset.id);x.onclick=run;x.onkeydown=v=>v.key==='Enter'&&run()})}
async function openAlbum(id,push=true){album=albums.find(a=>String(a.id)===String(id));if(!album)return;photos=[];page=0;more=true;e.albumsView.classList.add('hidden');e.gallery.classList.remove('hidden');e.back.classList.remove('hidden');e.title.textContent=album.title;e.detailTitle.innerHTML='<h2>'+esc(album.title)+'</h2>'+(album.description?'<p>'+esc(album.description)+'</p>':'');e.detailInfo.textContent=(date(album.album_date)?date(album.album_date)+' · ':'')+Number(album.photo_count||0)+' photos';e.photos.innerHTML='';if(push){const qp=new URLSearchParams(location.search);qp.set('album',id);history.pushState({album:id},'',location.pathname+'?'+qp.toString())}await nextPage()}
async function nextPage(){if(!album||!more||loading)return;loading=true;e.more.textContent='読み込み中...';const from=page*pageSize,to=from+pageSize-1;const{data,error}=await sb.from('photo_album_photos').select('id,image_path,thumb_path,caption,position').eq('album_id',album.id).order('position',{ascending:true}).range(from,to);if(error){loading=false;return toast(error.message)}const batch=(data||[]).map(p=>({...p,image_url:url(p.image_path),thumb_url:url(p.thumb_path)})),base=photos.length;photos.push(...batch);batch.forEach((p,i)=>e.photos.insertAdjacentHTML('beforeend','<button class="tile" data-i="'+(base+i)+'"><img loading="lazy" src="'+esc(p.thumb_url)+'" alt=""></button>'));e.photos.querySelectorAll('.tile:not([data-b])').forEach(b=>{b.dataset.b='1';b.onclick=()=>show(Number(b.dataset.i))});page++;more=batch.length===pageSize;e.more.textContent=more?'スクロールしてさらに表示':photos.length+' PHOTOS';loading=false}
function back(){album=null;photos=[];e.gallery.classList.add('hidden');e.albumsView.classList.remove('hidden');e.back.classList.add('hidden');e.title.textContent=site?.page_title||'My Photo Album';const qp=new URLSearchParams(location.search);qp.delete('album');history.pushState({},'',location.pathname+(qp.toString()?'?'+qp.toString():''))}
function show(i){idx=i;paint();if(!e.light.open)e.light.showModal()}function paint(){const p=photos[idx];if(!p)return;e.big.src=p.image_url;e.cap.textContent=p.caption||'';e.pc.textContent=(idx+1)+' / '+photos.length;e.prev.disabled=idx<=0;e.next.disabled=idx>=photos.length-1&&!more}async function goNext(){if(idx<photos.length-1){idx++;paint()}else if(more){await nextPage();if(idx<photos.length-1){idx++;paint()}}}function goPrev(){if(idx>0){idx--;paint()}}
e.sort.onchange=renderAlbums;e.back.onclick=back;e.detailBack.onclick=back;e.close.onclick=()=>e.light.close();e.next.onclick=goNext;e.prev.onclick=goPrev;new IntersectionObserver(v=>v[0]?.isIntersecting&&nextPage(),{rootMargin:'600px'}).observe(e.more);let tx=0;e.light.ontouchstart=v=>tx=v.changedTouches[0].clientX;e.light.ontouchend=v=>{const d=v.changedTouches[0].clientX-tx;if(Math.abs(d)>45)(d<0?goNext():goPrev())};addEventListener('popstate',()=>{const q=new URLSearchParams(location.search).get('album');q?openAlbum(q,false):(e.gallery.classList.contains('hidden')||back())});loadSite();
</script>
</body>
</html>
