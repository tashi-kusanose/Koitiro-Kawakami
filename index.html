<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbfaf7">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>川上 公一郎｜アルバム</title>
<style>
:root{--bg:#fbfaf7;--paper:#fff;--ink:#2d2a26;--mut:#918a80;--line:#ebe6df;--gold:#ad9166;--shadow:0 12px 32px rgba(62,52,40,.08)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink)}button{font:inherit}.hidden{display:none!important}body.viewerOpen{overflow:hidden}
.page{max-width:780px;margin:auto;padding:calc(env(safe-area-inset-top) + 22px) 18px 96px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px}.brand{font-size:11px;letter-spacing:.24em;color:var(--gold)}.topActions{display:flex;gap:8px}.pill{border:1px solid var(--line);background:rgba(255,255,255,.9);color:#655d53;padding:8px 12px;border-radius:999px;font-size:12px;text-decoration:none;cursor:pointer}
.hero{padding:6px 0 34px}.hero h1{margin:0;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(40px,10vw,66px);letter-spacing:.08em;font-weight:600}.hero p{margin:14px 0 0;color:var(--mut);font-size:14px;line-height:1.8}.sectionHead{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}.sectionHead h2{margin:0;font-size:16px}.sectionHead span{font-size:11px;color:var(--mut)}
.years{display:grid;gap:14px}.yearCard{position:relative;border:0;padding:0;width:100%;text-align:left;border-radius:24px;overflow:hidden;min-height:190px;background:#eee;box-shadow:var(--shadow);cursor:pointer}.yearCard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.yearCard .fallback{position:absolute;inset:0;background:linear-gradient(145deg,#d8c7b0,#f2e8dc 48%,#b9a58c)}.yearCard:nth-child(2n) .fallback{background:linear-gradient(145deg,#d9e1e4,#b8c4c9 48%,#eee9e2)}.yearCard:nth-child(3n) .fallback{background:linear-gradient(145deg,#ead8d2,#c8aba1 48%,#f3ece5)}.yearShade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(22,20,18,.52),rgba(22,20,18,.05) 74%)}.yearInfo{position:absolute;z-index:2;left:18px;right:18px;bottom:17px;color:#fff}.yearNum{font-family:Georgia,"Times New Roman",serif;font-size:50px;line-height:1}.yearMeta{font-size:11px;margin-top:8px;opacity:.92}.latest{position:absolute;z-index:3;left:16px;top:16px;background:rgba(255,255,255,.88);padding:6px 9px;border-radius:999px;font-size:10px;color:#665c50}.arrow{position:absolute;z-index:3;right:16px;top:16px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.88);display:grid;place-items:center;color:#4c443b;font-size:22px}.empty{padding:50px 20px;border:1px dashed var(--line);border-radius:20px;text-align:center;color:var(--mut);background:#fff}
.detailTop{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.back{border:1px solid var(--line);background:#fff;color:#655d53;border-radius:999px;padding:9px 13px;cursor:pointer}.detailHero{padding:10px 0 28px}.kicker{font-size:11px;letter-spacing:.25em;color:var(--gold);margin-bottom:10px}.detailYear{margin:0;font-family:Georgia,"Times New Roman","Yu Mincho",serif;font-size:clamp(66px,18vw,110px);line-height:.88;font-weight:500;letter-spacing:-.04em}.detailDesc{margin:18px 0 0;color:var(--mut);font-size:13px;line-height:1.85}.summary{display:flex;gap:9px;margin-top:20px}.sum{min-width:92px;background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:18px;padding:12px}.sum b{display:block;font-size:17px;margin-bottom:3px}.sum span{color:var(--mut);font-size:10px}.photoHead{display:flex;align-items:flex-end;justify-content:space-between;margin:4px 0 13px}.photoHead h2{margin:0;font-size:16px}.photoHead span{color:var(--mut);font-size:11px}.masonry{columns:2;column-gap:10px}.tile{display:block;width:100%;break-inside:avoid;border:0;padding:0;margin:0 0 10px;border-radius:18px;overflow:hidden;background:#eee;box-shadow:0 8px 20px rgba(57,47,36,.06);cursor:zoom-in}.tile img{width:100%;height:auto;display:block}.more{text-align:center;padding:24px 0;color:var(--mut);font-size:11px}
/* Intro */
.intro{position:fixed;inset:0;z-index:1000;overflow:hidden;background:radial-gradient(circle at 50% 42%,#fff 0 15%,rgba(255,252,246,.97) 42%,rgba(247,239,226,.99) 100%)}.intro.out{animation:introOut .9s ease forwards;pointer-events:none}@keyframes introOut{to{opacity:0;filter:blur(7px);transform:scale(1.015)}}.introGlow{position:absolute;width:78vw;height:78vw;max-width:720px;max-height:720px;left:50%;top:46%;transform:translate(-50%,-50%) scale(.45);border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.98),rgba(255,255,255,.2) 46%,transparent 72%);filter:blur(6px);animation:glow 6.2s ease forwards}@keyframes glow{0%{opacity:.15;transform:translate(-50%,-50%) scale(.45)}35%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:.4;transform:translate(-50%,-50%) scale(1.55)}}.lightLine{position:absolute;z-index:2;left:-35%;top:46%;width:34%;height:1px;background:linear-gradient(90deg,transparent,rgba(173,145,102,.85),transparent);box-shadow:0 0 18px rgba(173,145,102,.28);animation:lineMove 1.7s cubic-bezier(.3,.7,.2,1) .45s forwards}@keyframes lineMove{0%{left:-35%;opacity:0}18%{opacity:1}70%{opacity:1}100%{left:110%;opacity:0}}.stack{position:absolute;inset:0;z-index:4;pointer-events:none}.introCard{position:absolute;width:min(38vw,190px);aspect-ratio:4/5;border:9px solid #fff;border-bottom-width:26px;border-radius:3px;box-shadow:0 18px 48px rgba(80,62,43,.18);opacity:0;background:#e8dfd2}.introCard img{width:100%;height:100%;object-fit:cover;display:block}.ic1{left:9%;top:28%;animation:ic1 1.55s ease 1.4s forwards}.ic2{right:10%;top:24%;animation:ic2 1.55s ease 1.65s forwards}.ic3{left:50%;bottom:12%;animation:ic3 1.55s ease 1.95s forwards}@keyframes ic1{0%{opacity:0;transform:translateY(26px) rotate(-10deg) scale(.9)}60%{opacity:.96;transform:translateY(0) rotate(-7deg) scale(1)}100%{opacity:.92;transform:translateY(-4px) rotate(-6deg) scale(1)}}@keyframes ic2{0%{opacity:0;transform:translateY(26px) rotate(9deg) scale(.9)}60%{opacity:.96;transform:translateY(0) rotate(6deg) scale(1)}100%{opacity:.92;transform:translateY(-4px) rotate(5deg) scale(1)}}@keyframes ic3{0%{opacity:0;transform:translateX(-50%) translateY(26px) rotate(1deg) scale(.9)}60%{opacity:.98;transform:translateX(-50%) translateY(0) rotate(0) scale(1)}100%{opacity:.96;transform:translateX(-50%) translateY(-4px) rotate(0) scale(1)}}.wash{position:absolute;inset:0;z-index:5;background:rgba(255,252,247,0);animation:washIn .85s ease 3.05s forwards;pointer-events:none}@keyframes washIn{to{background:rgba(255,252,247,.78)}}.introName{position:absolute;z-index:6;left:0;right:0;top:40%;text-align:center;opacity:0;animation:nameIn 1s ease 3.25s forwards,nameOut .65s ease 4.45s forwards}.introName .main{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(38px,10vw,72px);letter-spacing:.15em;font-weight:600}.introName .sub{margin-top:11px;font-size:11px;letter-spacing:.34em;color:var(--gold)}@keyframes nameIn{from{opacity:0;transform:translateY(12px);filter:blur(7px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}@keyframes nameOut{to{opacity:0;transform:translateY(-10px);filter:blur(4px)}}.expandPhoto{position:absolute;z-index:7;left:50%;top:50%;width:min(34vw,170px);aspect-ratio:4/5;transform:translate(-50%,-50%) scale(.8);opacity:0;border-radius:5px;box-shadow:0 18px 50px rgba(74,57,39,.16);overflow:hidden;background:#d7c6af;animation:expandPhoto 1.25s cubic-bezier(.2,.8,.2,1) 4.6s forwards}.expandPhoto img{width:100%;height:100%;object-fit:cover;display:block}@keyframes expandPhoto{0%{opacity:0;transform:translate(-50%,-50%) scale(.8);border-radius:8px}28%{opacity:1}72%{opacity:1;transform:translate(-50%,-50%) scale(1.8);border-radius:10px}100%{opacity:1;transform:translate(-50%,-50%) scale(7.8);border-radius:0}}.finalCopy{position:absolute;z-index:8;left:0;right:0;top:44%;text-align:center;opacity:0;color:#fff;animation:finalIn .65s ease 5.22s forwards,finalOut .45s ease 5.88s forwards;text-shadow:0 2px 18px rgba(0,0,0,.2)}.finalCopy .main{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(40px,11vw,64px);letter-spacing:.18em;font-weight:700}@keyframes finalIn{from{opacity:0;transform:scale(.97);filter:blur(4px)}to{opacity:1;transform:scale(1);filter:blur(0)}}@keyframes finalOut{to{opacity:0;filter:blur(3px)}}.whiteFlash{position:absolute;inset:0;z-index:9;background:#fff;opacity:0;animation:whiteFlash .72s ease 5.92s forwards}@keyframes whiteFlash{0%{opacity:0}40%{opacity:.95}100%{opacity:0}}.skip{position:absolute;right:16px;top:calc(env(safe-area-inset-top) + 16px);z-index:20;border:1px solid rgba(95,82,67,.16);background:rgba(255,255,255,.72);color:#6b5f52;border-radius:999px;padding:8px 13px;font-size:12px;letter-spacing:.12em;backdrop-filter:blur(9px);cursor:pointer}
/* viewer */
.viewer{position:fixed;inset:0;z-index:1200;background:#090909;color:#fff;display:none;touch-action:none}.viewer.show{display:block}.viewerTop{position:absolute;z-index:5;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 12px) 14px 18px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,rgba(0,0,0,.58),transparent)}.counter{font-size:12px;letter-spacing:.12em;color:#ffffffd9}.close{width:40px;height:40px;border:1px solid #ffffff40;border-radius:50%;background:#0005;color:#fff;font-size:22px;cursor:pointer}.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}.canvas{width:100%;height:100%;display:flex;align-items:center;justify-content:center;transform-origin:center;will-change:transform}.big{max-width:96vw;max-height:88vh;object-fit:contain;display:block}.nav{position:absolute;z-index:5;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1px solid #ffffff30;background:#0005;color:#fff;font-size:28px;cursor:pointer}.prev{left:10px}.next{right:10px}.viewerHint{position:absolute;z-index:5;left:0;right:0;bottom:0;padding:18px 16px calc(env(safe-area-inset-bottom) + 16px);text-align:center;background:linear-gradient(0deg,rgba(0,0,0,.58),transparent);font-size:10px;color:#ffffffa6}
.toast{position:fixed;z-index:2000;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100% - 28px);padding:12px 16px;border-radius:999px;background:#2d2a26;color:#fff;font-size:12px}
@media(min-width:760px){.page{padding-left:24px;padding-right:24px}.years{grid-template-columns:repeat(2,minmax(0,1fr))}.yearCard:first-child{grid-column:1/-1;min-height:260px}.masonry{columns:4}.nav{display:block}}
@media(max-width:559px){.nav{display:none}}

/* Saved header appearance and initial-state safety. */
.hero{background:var(--header,#fff);border-radius:22px;padding:24px 20px;margin-bottom:26px}
.hero h1{font-family:var(--title-font,"Yu Mincho",serif);font-size:clamp(28px,10vw,var(--title-size,66px));overflow-wrap:anywhere;white-space:pre-wrap}
.hero p{white-space:pre-wrap;overflow-wrap:anywhere}.hero #headerText{color:var(--ink);font-size:16px}
.brand{overflow-wrap:anywhere}.top{gap:12px}.topActions{flex-shrink:0}.pill,.back{background:var(--paper);color:var(--ink)}
.empty,.sum{background:var(--paper)}.empty button{margin-top:14px}.intro.hidden *{animation:none!important}
.introName,.finalCopy{padding:0 18px}.introName .main,.finalCopy .main{overflow-wrap:anywhere;white-space:pre-wrap}
.introName .main{font-family:var(--title-font,"Yu Mincho",serif)}
.nav:disabled{opacity:.3;cursor:default}.big{max-height:88dvh}.viewerHint{pointer-events:none}
#loadMore{display:block;margin:0 auto 20px}.tile:focus-visible,.yearCard:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
@media(max-width:559px){.nav{display:block;top:auto;bottom:62px;width:36px;height:36px;font-size:24px}}
</style>
</head>
<body>
<main class="page">
<section id="homeView">
  <div class="top"><div id="siteEyebrow" class="brand">アルバム</div><div class="topActions"><button id="replay" class="pill hidden">▶ イントロ</button><a class="pill" id="adminLink" href="admin.html" aria-label="管理画面">管理</a></div></div>
  <section class="hero"><h1 id="displayName">川上 公一郎</h1><p id="headerText" class="hidden"></p><p id="pageDescription" class="hidden"></p></section>
  <div class="sectionHead"><h2>年別アルバム</h2><span id="yearCount">読み込み中...</span></div>
  <div id="years" class="years"><div class="empty" role="status">アルバムを読み込んでいます…</div></div>
</section>
<section id="detailView" class="hidden">
  <div class="detailTop"><button id="back" class="back">‹ 年一覧</button><span id="detailBrand" class="brand">アルバム</span></div>
  <section class="detailHero"><div class="kicker">YEAR ALBUM</div><h1 id="detailYear" class="detailYear"></h1><p class="detailDesc">この年の写真をまとめています。<br>写真をタップすると大きく表示できます。</p><div class="summary"><div class="sum"><b id="detailCount">0</b><span>写真</span></div><div class="sum"><b id="detailYearSmall">—</b><span>対象年</span></div></div></section>
  <div class="photoHead"><h2>写真一覧</h2><span>写真をタップ</span></div><div id="photos" class="masonry"></div><div id="more" class="more"></div><button id="loadMore" class="pill hidden" type="button">さらに写真を読み込む</button>
</section>
</main>

<section id="intro" class="intro hidden" aria-hidden="true">
  <button id="skip" class="skip">SKIP</button><div class="introGlow"></div><div class="lightLine"></div>
  <div class="stack"><div class="introCard ic1" data-slot="0"></div><div class="introCard ic2" data-slot="1"></div><div class="introCard ic3" data-slot="2"></div></div>
  <div class="wash"></div><div class="introName"><div class="main">川上 公一郎</div><div class="sub">アルバム</div></div>
  <div id="expandPhoto" class="expandPhoto"></div><div class="finalCopy"><div class="main">思い出</div></div><div class="whiteFlash"></div>
</section>

<section id="viewer" class="viewer" role="dialog" aria-modal="true" aria-label="写真ビューア" aria-hidden="true"><div class="viewerTop"><div id="counter" class="counter"></div><button id="close" class="close" aria-label="写真を閉じる">×</button></div><button id="prev" class="nav prev" aria-label="前の写真">‹</button><button id="next" class="nav next" aria-label="次の写真">›</button><div id="stage" class="stage"><div id="canvas" class="canvas"><img id="big" class="big" alt=""></div></div><div class="viewerHint">左右スワイプで移動 ・ ピンチ / ダブルタップで拡大</div></section>
<div id="toast" class="toast hidden"></div>
<script type="module" src="index.js?v=20260930-1"></script>
</body>
</html>
